<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0D0D0D"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066C2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Letter Z -->
  <path d="M18 20 L38 20 L18 44 L38 44" 
        stroke="url(#logoGradient)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Letter R accent -->
  <circle cx="44" cy="28" r="3" fill="url(#logoGradient)"/>
  
  <!-- Outer border -->
  <circle cx="32" cy="32" r="30" stroke="url(#logoGradient)" stroke-width="2" fill="none" opacity="0.5"/>
</svg>

