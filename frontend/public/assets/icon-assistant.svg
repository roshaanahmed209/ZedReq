<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowa">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Chat window frame -->
  <rect x="35" y="40" width="130" height="120" rx="16" stroke="url(#ga)" stroke-width="2" opacity="0.4"/>
  <!-- AI bubble -->
  <rect x="50" y="58" width="80" height="24" rx="12" stroke="url(#ga)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="62" cy="70" r="4" fill="#3b82f6" filter="url(#glowa)" opacity="0.8"/>
  <line x1="72" y1="68" x2="118" y2="68" stroke="url(#ga)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="72" y1="74" x2="105" y2="74" stroke="url(#ga)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- User bubble -->
  <rect x="70" y="92" width="80" height="24" rx="12" stroke="url(#ga)" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="102" x2="138" y2="102" stroke="url(#ga)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="82" y1="108" x2="120" y2="108" stroke="url(#ga)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- AI sparkle -->
  <path d="M155 50 L158 57 L165 60 L158 63 L155 70 L152 63 L145 60 L152 57 Z" fill="url(#ga)" filter="url(#glowa)" opacity="0.7"/>
  <!-- Typing indicator dots -->
  <circle cx="58" cy="135" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="68" cy="135" r="3" fill="#6366f1" opacity="0.4"/>
  <circle cx="78" cy="135" r="3" fill="#8b5cf6" opacity="0.2"/>
</svg>
