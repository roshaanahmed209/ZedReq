<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZedReq — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1 class="logo">ZedReq</h1>
            <h2 class="page-title">Sign In</h2>
            
            <div class="auth-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="login">Sign In</button>
                    <button class="tab-btn" data-tab="register">Sign Up</button>
                </div>
                
                <div class="tab-content active" id="login">
                    <form id="loginForm">
                        <div class="input-wrapper">
                            <label>Username or Email</label>
                            <input type="text" id="loginUsername" placeholder="Username or Email" required>
                        </div>
                        <div class="input-wrapper">
                            <label>Password</label>
                            <input type="password" id="loginPassword" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn-primary">Sign In →</button>
                    </form>
                </div>
                
                <div class="tab-content" id="register">
                    <form id="registerForm">
                        <div class="input-wrapper">
                            <label>Full Name</label>
                            <input type="text" id="regFullName" placeholder="Full Name" required>
                        </div>
                        <div class="input-wrapper">
                            <label>Username</label>
                            <input type="text" id="regUsername" placeholder="Username" required>
                        </div>
                        <div class="input-wrapper">
                            <label>Email</label>
                            <input type="email" id="regEmail" placeholder="Email" required>
                        </div>
                        <div class="input-wrapper">
                            <label>Password</label>
                            <input type="password" id="regPassword" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn-primary">Sign Up →</button>
                    </form>
                </div>
                
                <div class="message" id="message"></div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="right-panel-content">
                <h2 class="welcome-title">Welcome to ZedReq</h2>
                <p class="welcome-message">Build your professional network, share insights, and grow your career together.</p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
