<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZedRec Database Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0d0d14;
            --bg-secondary: #13131f;
            --bg-card: #1a1a2e;
            --bg-hover: #252540;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2d44;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo::before {
            content: '⚡';
            font-size: 1.2rem;
        }
        
        .db-info {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        
        .db-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .db-info p:last-child {
            margin-bottom: 0;
        }
        
        .db-info strong {
            color: var(--text-primary);
        }
        
        .nav-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 8px;
        }
        
        .nav-item {
            display: block;
            padding: 10px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        
        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .nav-item:active {
            background: var(--accent);
            color: white;
        }
        
        /* Main Content */
        .main {
            margin-left: 280px;
            flex: 1;
            padding: 32px 40px;
            max-width: calc(100vw - 280px);
        }
        
        .header {
            margin-bottom: 32px;
        }
        
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            flex: 1;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        
        /* Table Cards */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
            scroll-margin-top: 20px;
        }
        
        .table-card.error {
            border-color: var(--error);
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        
        .table-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }
        
        .row-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-hover);
            padding: 6px 12px;
            border-radius: 6px;
        }
        
        .table-wrapper {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-weight: 600;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        
        .col-type {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        tr:hover td {
            background: var(--bg-hover);
        }
        
        td.null {
            color: var(--text-muted);
            font-style: italic;
        }
        
        td.json {
            color: var(--warning);
        }
        
        td.empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-style: italic;
        }
        
        .more-rows {
            text-align: center;
            padding: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        
        .error-msg {
            color: var(--error);
            padding: 20px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }
            .main {
                margin-left: 220px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">ZedRec DB</div>
        <div class="db-info">
            <p><strong>Host:</strong> localhost</p>
            <p><strong>Port:</strong> 5432</p>
            <p><strong>Database:</strong> zedreq</p>
            <p><strong>User:</strong> postgres</p>
        </div>
        <div class="nav-title">Tables (0)</div>
        <nav>
            
        </nav>
    </aside>
    
    <main class="main">
        <header class="header">
            <h1>Database Tables</h1>
            <p>Viewing all tables from the ZedRec PostgreSQL database</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <div class="value">0</div>
                <div class="label">Total Tables</div>
            </div>
            <div class="stat-card">
                <div class="value">0</div>
                <div class="label">Total Rows</div>
            </div>
        </div>
        
        
    </main>
    
    <script>
        // Smooth scroll for navigation
        document.querySelectorAll('.nav-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(link.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>
